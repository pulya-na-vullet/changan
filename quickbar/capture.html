<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>QuickBar — вёрстка состояний</title>
  <style>
    html, body { margin: 0; background: #0e1828; }
    /* 1 CSS px = 1 dp. Экран 1080×1920 как портретная ГУ. */
    .hu { width: 1080px; height: 1920px; position: relative; overflow: hidden;
      background:
        linear-gradient(#152033 1px, transparent 1px),
        linear-gradient(90deg, #152033 1px, transparent 1px),
        #101a2c;
      background-size: 48px 48px, 48px 48px, auto;
    }
    .route { position: absolute; left: 210px; top: 120px; width: 10px; height: 1500px;
      background: #3b82f6; border-radius: 8px; transform: rotate(-7deg);
      box-shadow: 0 0 0 8px rgba(59,130,246,.16); }
    .arrow { position: absolute; left: 248px; top: 980px; width: 0; height: 0;
      border-left: 16px solid transparent; border-right: 16px solid transparent;
      border-bottom: 28px solid #60a5fa; transform: rotate(-16deg); }
    .ime {
      display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 520px;
      background: #182235; border-top: 2px solid #31405c; color: #9aa7b8;
      font: 28px/1.2 "Noto Sans", sans-serif; padding: 24px 32px;
    }
    .panel {
      position: absolute; right: 0; top: 384px; width: 380px; height: 1152px;
      background: rgba(11,18,32,.90);
      border-radius: 18px 0 0 18px; border: 1px solid #663ddc97;
      border-right: 0; padding: 8px 6px; box-sizing: border-box;
      display: flex; flex-direction: column; font-family: "Noto Sans", "Noto Sans Display", sans-serif;
      color: #fff;
    }
    .title { color: #3ddc97; font-size: 36px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .wifi {
      display: flex; align-items: center; gap: 8px; margin: 0 0 8px;
      background: #3328e07a; border-radius: 12px; padding: 6px;
    }
    .wifi svg { width: 40px; height: 40px; }
    .wifi svg:first-of-type { fill: #3ddc97; }
    .wifi svg:last-of-type { fill: #fff; }
    .wifi .txt { flex: 1; }
    .wifi .name { font-size: 26px; font-weight: 700; }
    .wifi .st { font-size: 22px; color: #3ddc97; }
    .tools { display: flex; justify-content: center; gap: 0; }
    .tool { width: 48px; height: 48px; display: grid; place-items: center; padding: 8px; box-sizing: border-box; }
    .tool svg { width: 32px; height: 32px; fill: #fff; }
    .tool.active svg { fill: #3ddc97; }
    #killTool.active svg { fill: #ff6b6b; }
    .search {
      margin: 8px 0; background: #3328e07a; color: #fff; border: 0; border-radius: 4px;
      font-size: 26px; padding: 24px 8px; width: 100%; box-sizing: border-box;
    }
    .search::placeholder { color: #9aa7b8; }
    .list { flex: 1; overflow: hidden; }
    .hint { color: #9aa7b8; font-size: 22px; padding: 0 4px 8px; }
    .src { display: flex; gap: 6px; padding: 2px 2px 8px; }
    .srcbtn { flex: 1; text-align: center; font: 700 22px/1.2 "Noto Sans", sans-serif;
      padding: 14px 6px; border-radius: 12px; background: #31405c; color: #fff; }
    .srcbtn.on { background: #3ddc97; color: #0b1220; }
    .sec { color: #3ddc97; font-size: 26px; font-weight: 700; padding: 14px 4px 6px; }
    .row { display: flex; align-items: center; padding: 24px 4px; min-height: 168px; box-sizing: border-box; border-radius: 12px; }
    .row.fav { background: #3328e07a; }
    .row.hid { background: #22ff6b6b; }
    .row.apk { background: #2228e07a; min-height: auto; padding: 10px 4px; }
    .appico { width: 144px; height: 144px; border-radius: 28px; flex: 0 0 144px;
      display: grid; place-items: center; font-size: 54px; font-weight: 700; color: #fff; }
    .row.hid .appico { opacity: .45; }
    .txt { padding-left: 10px; flex: 1; min-width: 0; }
    .name { font-size: 28px; line-height: 1.15; }
    .mark { color: #9aa7b8; font-size: 20px; margin-top: 4px; }
    .act { display: flex; align-items: center; }
    .btn { width: 48px; height: 48px; border-radius: 12px; margin-left: 6px;
      display: grid; place-items: center; }
    .btn svg { width: 28px; height: 28px; fill: #fff; }
    .eye { background: #5a6a80; }
    .ok { background: #3ddc97; }
    .no { background: #ff6b6b; }
    .up { background: #31405c; }
    .inst { background: #3ddc97; }
    .inst svg { fill: #0b1220; }
    .chip {
      position: absolute; right: 0; width: 160px;
      background: rgba(11,18,32,.6); border-radius: 18px 0 0 18px;
      border: 1px solid #333ddc97; border-right: 0;
      display: none; align-items: center; justify-content: center;
      box-sizing: border-box; padding: 4px 2px;
    }
    .chip.menu { top: 384px; height: 140px; }
    .chip.recent { top: 1196px; height: 340px; flex-direction: column; justify-content: space-evenly; }
    .chip.peek { top: 384px; height: 140px; }
    .chip svg { width: 90px; height: 90px; fill: #cc3ddc97; }
    .mini { width: 90px; height: 90px; border-radius: 18px; }
    .chip.stash { background: transparent; border: 0; padding: 0; }
    body[data-state="collapsed"] .panel,
    body[data-state="peek"] .panel,
    body[data-state="stash"] .panel { display: none; }
    body[data-state="collapsed"] .chip.menu:not(.stash),
    body[data-state="collapsed"] .chip.recent:not(.stash) { display: flex; }
    body[data-state="stash"] .chip.stash.menu,
    body[data-state="stash"] .chip.stash.recent { display: block; }
    body[data-state="peek"] .chip.peek { display: flex; }
    body[data-state="peek"] .ime { display: block; }
    body[data-state="usb"] #reorderTool,
    body[data-state="usb"] #windowTool,
    body[data-state="usb"] #killTool { display: none; }
  </style>
</head>
<body data-state="list">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M8.6,4.2L16.4,12 8.6,19.8l-1.8,-1.8L12.8,12 6.8,6z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M12,6a6,6 0,1 0,5.3 8.8l-1.8,-1.1A4,4 0,1 1,12 8v3l4,-4 -4,-4v3z"/></symbol>
  <symbol id="i-usb" viewBox="0 0 24 24"><path d="M8,2h8v4H8zM9,6h6v11c0,2 -1.5,3.5 -3,3.5S9,19 9,17V6zM7,9h2v8H7zM15,9h2v8h-2z"/></symbol>
  <symbol id="i-apps" viewBox="0 0 24 24"><path d="M4,4h7v7H4z"/><path d="M13,4h7v7h-7z"/><path d="M4,13h7v7H4z"/><path d="M13,13h7v7h-7z"/></symbol>
  <symbol id="i-reorder" viewBox="0 0 24 24"><path d="M12,4l6,7H6zM12,20l-6,-7h12z"/></symbol>
  <symbol id="i-window" viewBox="0 0 24 24"><path d="M3,4h18v3H3z"/><path d="M3,7h2v13H3z"/><path d="M19,7h2v13h-2z"/><path d="M5,18h14v2H5z"/></symbol>
  <symbol id="i-kill" viewBox="0 0 24 24"><path d="M12,2a10,10 0 1 0 0.01,0zM9,7.6L12,10.6 15,7.6 16.4,9 13.4,12 16.4,15 15,16.4 12,13.4 9,16.4 7.6,15 10.6,12 7.6,9z" fill-rule="evenodd"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M1,9l2,2c4.97,-4.97 13.03,-4.97 18,0l2,-2C16.93,2.93 7.07,2.93 1,9zM5,13l2,2c2.76,-2.76 7.24,-2.76 10,0l2,-2C15.14,9.14 8.87,9.14 5,13zM9,17l3,3 3,-3C13.65,15.64 10.36,15.64 9,17z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12,8.4a3.6,3.6 0 1 1 0,7.2 3.6,3.6 0 0 1 0,-7.2zM19.1,12.9L21,11.3 19.1,8 16.7,9 15.1,7.1 14.7,4.6h-3.8L10.5,7.1 8.9,9 6.5,8 4.6,11.3 6.6,12.9 6.6,14.1 4.6,15.7 6.5,19 8.9,18 10.5,19.9 10.9,22.4h3.8l0.4,-2.5L16.7,18 19.1,19 21,15.7 19.1,14.1z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.1,3.5L3.5,2.1 21.9,20.5 20.5,21.9 16.7,18.1C15.3,18.7 13.7,19 12,19 7,19 2.7,15.9 1,11.5c0.6,-1.5 1.5,-2.9 2.7,-4.1L2.1,3.5zM6.1,7.5C4.9,8.5 4,9.9 3.4,11.5 4.9,14.7 8.2,17 12,17c1.2,0 2.3,-0.2 3.4,-0.6L13.6,14.6C13.1,14.9 12.6,15 12,15c-1.9,0 -3.5,-1.6 -3.5,-3.5 0,-0.6 0.1,-1.1 0.4,-1.6L6.1,7.5zM12,5c5,0 9.3,3.1 11,7.5 -0.4,1.1 -1,2.1 -1.7,3L19.7,14c0.6,-0.8 1.1,-1.6 1.4,-2.5C19.6,8.3 16.1,6.5 12,6.5c-0.7,0 -1.4,0.1 -2,0.2L8.4,5.1C9.5,5 10.8,5 12,5zM12,8.5c0.4,0 0.8,0.1 1.2,0.2L9.7,12.2C9.6,11.8 9.5,11.4 9.5,11 9.5,9.6 10.6,8.5 12,8.5z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9,16.2L4.8,12 3.4,13.4 9,19 21,7 19.6,5.6z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M19,6.4L17.6,5 12,10.6 6.4,5 5,6.4 10.6,12 5,17.6 6.4,19 12,13.4 17.6,19 19,17.6 13.4,12z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M7,14l5,-6 5,6z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M7,10l5,6 5,-6z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4,5h16v3H4z"/><path d="M4,10.5h16v3H4z"/><path d="M4,16h16v3H4z"/></symbol>
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4,4h16v4H4zM4,10h10v4H4zM4,16h16v4H4z"/></symbol>
  <symbol id="i-install" viewBox="0 0 24 24"><path d="M11,2h2v10h4l-5,6 -5,-6h4zM4,18h16v2H4z"/></symbol>
  <symbol id="i-sign" viewBox="0 0 24 24"><path d="M12,1a5,5 0 0 1 5,5v3h1.5A1.5,1.5 0 0 1 20,10.5v10A1.5,1.5 0 0 1 18.5,22h-13A1.5,1.5 0 0 1 4,20.5v-10A1.5,1.5 0 0 1 5.5,9H7V6A5,5 0 0 1 12,1zM12,3a3,3 0 0 0-3,3v3h6V6A3,3 0 0 0 12,3zM12,13a1.5,1.5 0 0 0-1,2.7V18h2v-2.3A1.5,1.5 0 0 0 12,13z"/></symbol>
</svg>
<div class="hu">
  <div class="route"></div>
  <div class="arrow"></div>
  <aside class="panel" id="panel">
    <div class="title" id="title">QuickBar 1.3.19</div>
    <div class="wifi" id="wifiStrip">
      <svg><use href="#i-wifi"/></svg>
      <div class="txt"><div class="name">Wi-Fi</div><div class="st">Вкл</div></div>
      <svg><use href="#i-gear"/></svg>
    </div>
    <div class="tools">
      <div class="tool"><svg><use href="#i-collapse"/></svg></div>
      <div class="tool"><svg><use href="#i-refresh"/></svg></div>
      <div class="tool" id="usbTool"><svg><use href="#i-usb"/></svg></div>
      <div class="tool" id="reorderTool"><svg><use href="#i-reorder"/></svg></div>
      <div class="tool active" id="windowTool"><svg><use href="#i-window"/></svg></div>
      <div class="tool" id="killTool"><svg><use href="#i-kill"/></svg></div>
    </div>
    <input class="search" id="search" placeholder="поиск" readonly>
    <div class="list" id="list"></div>
  </aside>
  <div class="chip menu"><svg><use href="#i-menu"/></svg></div>
  <div class="chip recent">
    <div class="mini" style="background:#e11d48"></div>
    <div class="mini" style="background:#229ed9"></div>
    <div class="mini" style="background:#fc3f1d"></div>
  </div>
  <div class="chip peek"><svg><use href="#i-logo"/></svg></div>
  <div class="chip stash menu"></div>
  <div class="chip stash recent"></div>
  <div class="ime">клавиатура · панель свернута в уголок, чтобы не перекрывать ввод</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const state = q.get("state") || "list";
  document.body.dataset.state = state;
  const apps = [
    { name: "Yandex Navigator", mark: "★ избранное", fav: true, color: "#e11d48", letter: "Я" },
    { name: "Telegram", mark: "удерживайте ★", color: "#229ed9", letter: "T" },
    { name: "NewPipe", mark: "удерживайте ★", color: "#fc3f1d", letter: "N" },
    { name: "Яндекс Музыка", mark: "удерживайте ★", color: "#fc3f1d", letter: "♪" }
  ];
  function eye() { return '<div class="btn eye"><svg><use href="#i-eye"/></svg></div>'; }
  function pending() {
    return '<div class="act"><div class="btn ok"><svg><use href="#i-check"/></svg></div><div class="btn no"><svg><use href="#i-close"/></svg></div></div>';
  }
  function arrows() {
    return '<div class="act"><div class="btn up"><svg><use href="#i-up"/></svg></div><div class="btn up"><svg><use href="#i-down"/></svg></div></div>';
  }
  function row(app, extra, action) {
    return '<div class="row ' + extra + '"><div class="appico" style="background:' + app.color + '">' + app.letter + '</div><div class="txt"><div class="name">' + app.name + '</div><div class="mark">' + app.mark + '</div></div>' + action + '</div>';
  }
  const list = document.getElementById("list");
  if (state === "reorder") {
    document.getElementById("title").textContent = "Порядок списка";
    document.getElementById("reorderTool").classList.add("active");
    document.getElementById("windowTool").classList.remove("active");
    apps.slice(0, 3).forEach(function (a, i) {
      a.mark = "стрелки — порядок в списке";
      list.insertAdjacentHTML("beforeend", row(a, i === 0 ? "fav" : "", arrows()));
    });
    list.insertAdjacentHTML("beforeend", '<div class="sec">▸  Системные  ·  18</div>');
  } else if (state === "hide") {
    apps[3].mark = "галочка — скрыть, крестик — отмена";
    apps.slice(0, 3).forEach(function (a, i) {
      list.insertAdjacentHTML("beforeend", row(a, i === 0 ? "fav" : "", '<div class="act">' + eye() + "</div>"));
    });
    list.insertAdjacentHTML("beforeend", row(apps[3], "", pending()));
    list.insertAdjacentHTML("beforeend", '<div class="sec">▸  Системные  ·  18</div>');
    list.insertAdjacentHTML("beforeend", '<div class="sec">▸  Скрытые  ·  2</div>');
  } else if (state === "system") {
    apps.slice(0, 3).forEach(function (a, i) {
      list.insertAdjacentHTML("beforeend", row(a, i === 0 ? "fav" : "", '<div class="act">' + eye() + "</div>"));
    });
    list.insertAdjacentHTML("beforeend", '<div class="sec">▾  Системные  ·  18</div>');
    list.insertAdjacentHTML("beforeend", row({ name: "Settings", mark: "системное", color: "#31405c", letter: "⚙" }, "", ""));
    list.insertAdjacentHTML("beforeend", row({ name: "Radio", mark: "системное", color: "#1d4ed8", letter: "R" }, "", ""));
    list.insertAdjacentHTML("beforeend", '<div class="sec">▸  Скрытые  ·  2</div>');
  } else if (state === "hidden") {
    apps.slice(0, 3).forEach(function (a, i) {
      list.insertAdjacentHTML("beforeend", row(a, i === 0 ? "fav" : "", '<div class="act">' + eye() + "</div>"));
    });
    list.insertAdjacentHTML("beforeend", '<div class="sec">▸  Системные  ·  18</div>');
    list.insertAdjacentHTML("beforeend", '<div class="sec">▾  Скрытые  ·  2</div>');
    list.insertAdjacentHTML("beforeend", row({ name: "Yandex Music", mark: "скрыто в панели", color: "#7c3aed", letter: "M" }, "hid", '<div class="act">' + eye() + "</div>"));
    list.insertAdjacentHTML("beforeend", row({ name: "VLC", mark: "скрыто в панели", color: "#334155", letter: "V" }, "hid", '<div class="act">' + eye() + "</div>"));
  } else if (state === "usb" || state === "memory") {
    document.getElementById("usbTool").innerHTML = '<svg><use href="#i-apps"/></svg>';
    document.getElementById("search").placeholder = "apk";
    var mem = state === "memory";
    list.insertAdjacentHTML("beforeend", '<div class="src"><div class="srcbtn' + (mem ? "" : " on") + '">USB</div><div class="srcbtn' + (mem ? " on" : "") + '">Память ГУ</div></div>');
    list.insertAdjacentHTML("beforeend", mem
      ? '<div class="hint">Память самого ГУ, не флешка. Ключ — подписать белым списком. Зелёная кнопка — установка.</div>'
      : '<div class="hint">Флешка в USB-разъёме ГУ. Ключ — подписать белым списком (как Hub). Зелёная кнопка — установка.</div>');
    if (mem) {
      list.insertAdjacentHTML("beforeend", '<div class="row apk"><div class="txt"><div class="name">org.telegram.messenger.apk</div><div class="mark">/storage/emulated/0/Download · 48 МБ · нужна подпись ГУ</div></div><div class="btn up"><svg><use href="#i-sign"/></svg></div><div class="btn inst"><svg><use href="#i-install"/></svg></div></div>');
    } else {
      list.insertAdjacentHTML("beforeend", '<div class="row apk"><div class="txt"><div class="name">ru.yandex.yandexnavi-30.7.3.apk</div><div class="mark">/mnt/media_rw/ABCD · 345 МБ · нужна подпись ГУ</div></div><div class="btn up"><svg><use href="#i-sign"/></svg></div><div class="btn inst"><svg><use href="#i-install"/></svg></div></div>');
      list.insertAdjacentHTML("beforeend", '<div class="row apk"><div class="txt"><div class="name">ru.kinopoisk-7.103.0.apk</div><div class="mark">/mnt/media_rw/ABCD · 71 МБ · нужна подпись ГУ</div></div><div class="btn up"><svg><use href="#i-sign"/></svg></div><div class="btn inst"><svg><use href="#i-install"/></svg></div></div>');
    }
  } else if (state === "kill") {
    document.getElementById("title").textContent = "Закрыть приложения";
    document.getElementById("killTool").classList.add("active");
    document.getElementById("windowTool").classList.remove("active");
    document.getElementById("search").placeholder = "закрыть";
    list.insertAdjacentHTML("beforeend", '<div class="hint">Как KillAPK: крестик закрывает одно приложение. Системные службы ГУ не трогаю.</div>');
    list.insertAdjacentHTML("beforeend", '<div class="row hid"><div class="txt"><div class="name">Закрыть сторонние · 2</div><div class="mark">все пользовательские из списка</div></div><div class="btn no"><svg><use href="#i-kill"/></svg></div></div>');
    apps.slice(0, 2).forEach(function (a) {
      a.mark = "запущено · крестик закроет";
      list.insertAdjacentHTML("beforeend", row(a, "", '<div class="act"><div class="btn no"><svg><use href="#i-close"/></svg></div></div>'));
    });
  } else if (state === "search") {
    document.getElementById("search").value = "яндекс";
    list.insertAdjacentHTML("beforeend", row(apps[0], "fav", '<div class="act">' + eye() + "</div>"));
    list.insertAdjacentHTML("beforeend", row(apps[3], "", '<div class="act">' + eye() + "</div>"));
  } else if (state !== "collapsed" && state !== "peek" && state !== "stash") {
    apps.slice(0, 3).forEach(function (a, i) {
      list.insertAdjacentHTML("beforeend", row(a, i === 0 ? "fav" : "", '<div class="act">' + eye() + "</div>"));
    });
    list.insertAdjacentHTML("beforeend", '<div class="sec">▸  Системные  ·  18</div>');
    list.insertAdjacentHTML("beforeend", '<div class="sec">▸  Скрытые  ·  2</div>');
  }
  if (state === "stash" && q.get("guide") === "1") {
    document.querySelectorAll(".chip.stash").forEach(function (el) {
      el.style.outline = "3px dashed rgba(61,220,151,.55)";
    });
  }
</script>
</body>
</html>
